name: Publish course to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the course
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser testing dependencies
        run: npx playwright install --with-deps chromium
      - name: Refresh the public market snapshot
        run: npm run market:snapshot -- --allow-stale
      - name: Build and test the course
        run: npm run check:all
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Package the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
